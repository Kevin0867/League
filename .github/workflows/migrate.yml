name: Migrate database

# Manually-triggered, non-destructive migration runner. Applies any pending
# Prisma migrations to the production (Neon) database via `prisma migrate
# deploy`. It never wipes or seeds data — use this to roll out schema changes
# between deploys.
#
# Requires repo secret DATABASE_URL (the Neon connection string).

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify DATABASE_URL is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
      - run: npm ci
      - run: npx prisma generate
      - name: Apply pending migrations
        run: npx prisma migrate deploy
