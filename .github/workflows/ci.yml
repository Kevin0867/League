name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pure
          POSTGRES_PASSWORD: pure
          POSTGRES_DB: pure_academy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pure:pure@localhost:5432/pure_academy?schema=public
      DIRECT_URL: postgresql://pure:pure@localhost:5432/pure_academy?schema=public
      AUTH_SECRET: ci-secret-not-used-in-production
      # Dummy key so field-encryption code paths run in CI (not a real secret).
      FIELD_ENCRYPTION_KEY: kXX/Um0Z8z8mDK1GMUrWrvp4Md5ft47O72omYnlyOPI=
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed (smoke test the seed + encryption path)
        run: npm run db:seed

      - name: Build (compiles + typechecks)
        run: npm run build
