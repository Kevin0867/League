name: Import enrollments

# Manually-triggered importer that loads a PURE Academy enrollment CSV directly
# into the database (the CI runner can reach the Neon database that the browser
# upload path also targets). Safe to re-run: people are matched on name +
# email/phone and merged, and existing registrations are reused.
#
# Requirements:
#   - Repository secret DATABASE_URL set to the Neon connection string.
#
# CSV source (either works):
#   - a data/enrollments.csv file present on the dispatched ref (e.g. a
#     short-lived branch, so enrollee PII never lands in the main history), or
#   - the csv_gz_b64 input: base64(gzip(csv)).

on:
  workflow_dispatch:
    inputs:
      csv_gz_b64:
        description: "base64(gzip(enrollment CSV)) — optional if data/enrollments.csv is committed on this ref"
        required: false
        default: ""

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # schema.prisma uses directUrl for migrations; the CI secret is already a
      # direct (non-pooled) connection, so reuse it here.
      DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
      CSV_GZ_B64: ${{ inputs.csv_gz_b64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Verify DATABASE_URL is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Apply database migrations
        run: npx prisma migrate deploy
      - name: Import enrollments
        run: |
          if [ -f data/enrollments.csv ]; then
            echo "Importing from committed data/enrollments.csv"
            npx tsx --tsconfig tsconfig.scripts.json scripts/import-enrollments.ts data/enrollments.csv
          else
            echo "Importing from csv_gz_b64 input"
            npx tsx --tsconfig tsconfig.scripts.json scripts/import-enrollments.ts
          fi
