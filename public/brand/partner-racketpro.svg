<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 170" role="img" aria-label="RacketPro">
  <title>RacketPro</title>
  <!-- rp monogram: two-tone ring (navy with an orange lower-left arc) -->
  <circle cx="90" cy="90" r="58" fill="none" stroke="#0c3c68" stroke-width="22"/>
  <circle cx="90" cy="90" r="58" fill="none" stroke="#f08a1c" stroke-width="22"
          stroke-linecap="round" stroke-dasharray="104 261" transform="rotate(118 90 90)"/>
  <!-- navy 'p' stem inside the ring -->
  <rect x="82" y="60" width="15" height="72" rx="7.5" fill="#0c3c68"/>
  <!-- wordmark -->
  <text x="182" y="123" font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="104" letter-spacing="-3" fill="#0c3c68">racketpro</text>
</svg>
